<body style="overflow-x: hidden; overflow-y: hidden;">
        <div class="row px-3"  style="height: 100vh">
            <div class="col-2" id="filters" style="box-shadow: 12px 0 24px rgba(0, 0, 0, 0.1);">
                <div class="filter-block mt-5">
                    <h4 class="mb-4">Фильтры</h4>
                    <label for="price">Цена от:</label><br>
                    <div id="price" class="row">
                        <div class="col-12">
                            <input id="minPrice" class="col-10"><br>
                            <label for="maxPrice">До:</label><br>
                            <input id="maxPrice" class="col-10"><br>
                        </div>
                    </div>
                    <label for="category" class="mt-3">Тип товара:</label><br>
                    <select id="category" name="category" class="mb-4">
                        <option value="1">Все</option>
                        <option value="2">Корма</option>
                        <option value="3">Медицина</option>
                        <option value="4">Игрушки</option>
                    </select><br>
                    <label for="animal">Животное:</label><br>
                    <select id="animal" name="animal" class="mb-4">
                        <option value="1">Все</option>
                        <option value="2">Кошка</option>
                        <option value="3">Собака</option>
                        <option value="4">Другое</option>
                    </select><br>          
                </div>
            </div>
            <div class="col-10 px-0" id="products-container" style="height: calc(100vh - 78px); overflow-y: auto;">
                <div class="container-lg">
                    <div id="recc">
                        <h2 class="text-center mb-4">Новые товары</h2>
                        <ul id="new-products-list" class="card-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    <script>
        let newProductsList = document.getElementById('new-products-list');

        for (let i = 0; i < 15; i++) {
            let listItem = document.createElement('li');

            let link = document.createElement('a');
            link.setAttribute('href', 'product.html');

            let cardDiv = document.createElement('div');
            cardDiv.setAttribute('class', 'card mb-4');
            cardDiv.setAttribute('style', 'width: 12rem; height: 20rem;');

            let img = document.createElement('img');
            img.setAttribute('src', 'https://resources.cdn-kaspi.kz/img/m/p/h7e/h48/64523096719390.jpg?format=gallery-medium');
            img.setAttribute('class', 'card-img-top');
            img.setAttribute('alt', '...');

            let cardBodyDiv = document.createElement('div');
            cardBodyDiv.setAttribute('class', 'card-body');

            let cardText = document.createElement('p');
            cardText.setAttribute('class', 'card-text');
            cardText.textContent = 'Игрушка утка мягкая';

            let bold = document.createElement('b');
            bold.textContent = '2400 ₸';

            cardBodyDiv.appendChild(cardText);
            cardBodyDiv.appendChild(bold);
            cardDiv.appendChild(img);
            cardDiv.appendChild(cardBodyDiv);
            link.appendChild(cardDiv);
            listItem.appendChild(link);

            newProductsList.appendChild(listItem);
        }
    </script>
