<div class="container-xl">
    <div class="row">
        <div class="col-12">
            <div class="container-lg">
                <div id="recc">
                    <h2 class="text-center mb-4">Рекомендуемые товары</h2>
                    <div id="products-list" class="card-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="container-fluid bg-dark py-3" style="margin-bottom: auto;">
    <div class="row mt-3">
        <div class="">
            <p class="text-light">Контакты:</p>
        </div>
    </div>
</div>

<script>
    let productsList = document.getElementById('products-list');

    for (let i = 0; i < 3; i++) {
        let cardDiv = document.createElement('div');
        cardDiv.setAttribute('class', 'card mb-3');
        cardDiv.setAttribute('style', 'min-width: 930px;');

        let rowDiv = document.createElement('div');
        rowDiv.setAttribute('class', 'row');

        let imgColDiv = document.createElement('div');
        imgColDiv.setAttribute('class', 'col-md-2');

        let img = document.createElement('img');
        img.setAttribute('src', '...');
        img.setAttribute('class', 'img-fluid rounded-start');
        img.setAttribute('style', 'max-width: 150px; max-height: 180px;');

        let contentColDiv = document.createElement('div');
        contentColDiv.setAttribute('class', 'col-md-8');

        let cardBodyDiv = document.createElement('div');
        cardBodyDiv.setAttribute('class', 'card-body');

        let title = document.createElement('h5');
        title.setAttribute('class', 'card-title');
        title.textContent = 'Название товара';

        let description = document.createElement('p');
        description.setAttribute('class', 'card-text');
        description.textContent = 'Описание товара';

        let price = document.createElement('b');
        price.textContent = 'Цена';

        cardBodyDiv.appendChild(title);
        cardBodyDiv.appendChild(description);
        cardBodyDiv.appendChild(price);
        contentColDiv.appendChild(cardBodyDiv);
        imgColDiv.appendChild(img);
        rowDiv.appendChild(imgColDiv);
        rowDiv.appendChild(contentColDiv);
        cardDiv.appendChild(rowDiv);
        productsList.appendChild(cardDiv);
    }
</script>
